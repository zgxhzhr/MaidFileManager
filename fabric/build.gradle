plugins {
    id 'multiloader-loader'
    id 'fabric-loom'
    id 'me.modmuss50.mod-publish-plugin' version '2.2.0'
}
dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings loom.layered {
        officialMojangMappings()
    }
    modImplementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_version}"
    implementation group: 'com.google.code.findbugs', name: 'jsr305', version: '3.0.1'
    implementation project(":common")
    // 车万女仆编译期依赖：仅引用其 API，运行时由玩家自行安装
    modCompileOnly files(rootProject.file(tlm_jar_path))
}

// 工程面向 1.20（fabric.mod.json 声明 >=1.20 <1.20.2），但工具链沿用 1.20.1 的 loader/API 版本，
// 不能沿用 buildSrc 的 ${minecraft_version} 命名公式，否则产物会被错误命名成 fabric-1.20.1
base {
    archivesName = "maid_file_manager-fabric-1.20"
}

loom {
    if (project(":common").file("src/main/resources/${mod_id}.accesswidener").exists()) {
        accessWidenerPath.set(project(":common").file("src/main/resources/${mod_id}.accesswidener"))
    }
    mixin {
        defaultRefmapName.set("${mod_id}.refmap.json")
    }
    runs {
        client {
            client()
            setConfigName("Fabric Client")
            ideConfigGenerated(true)
            runDir("run")
        }
        server {
            server()
            setConfigName("Fabric Server")
            ideConfigGenerated(true)
            runDir("run")
        }
    }
}

publishMods {
    file = tasks.named('remapJar').get().archiveFile
    changelog = file("${rootDir}/CHANGELOG.md").exists() ? file("${rootDir}/CHANGELOG.md").text : 'See release notes on GitHub'
    type = STABLE
    modLoaders.add('fabric')

    curseforge {
        projectId = '1681684'
        accessToken = providers.environmentVariable('CURSEFORGE_TOKEN')
        minecraftVersions.add('1.20')
        displayName = 'Maid File Manager v' + project.version + ' fabric 1.20'
    }
}