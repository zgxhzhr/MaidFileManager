# ========== 项目基本信息 ==========
mod_id=maid_file_manager
mod_name=Maid File Manager
mod_author=zgxhzhr
mod_description=车万女仆附属模组，支持跨版本导入导出女仆数据
license=CC0-1.0
credits=Thanks to TartaricAcid for Touhou Little Maid

# ========== 项目与 Java 版本 ==========
version=1.2.0
group=com.example.maid_file_manager
java_version=17

# ========== Minecraft 与映射 ==========
minecraft_version=1.20.1
minecraft_version_range=[1.20.1, 1.22)
# ParchmentMC 1.20.1 稳定版，参见 https://parchmentmc.org/docs/getting-started
parchment_minecraft=1.20.1
parchment_version=2023.09.03

# ========== Fabric 配置 ==========
fabric_version=0.92.1+1.20.1
fabric_loader_version=0.16.9

# ========== Forge 配置 ==========
forge_version=47.2.30
forge_loader_version_range=[47,)

# ========== 车万女仆配置 ==========
tlm_version=1.5.3
# 本地 TLM jar 路径（同时作为 Forge/Fabric 编译期依赖，仅引用其 API）
# 注意：路径中不要含中文，避免 gradle.properties 按 ISO-8859-1 读取时乱码
tlm_jar_path=libs/touhoulittlemaid-1.5.3.jar

# ========== Gradle 配置：JDK 双版本白名单（JDK17 用于编译 class，JDK21 用于 NeoForm Runtime 工具） ==========
# 关键原因：net.neoforged.moddev.legacyforge 2.0.77 插件要求 createMinecraftArtifacts 任务（NeoForm 运行 mappings 处理）使用 JDK21。
# 因此把系统上已安装的两个 JDK21（ms-21.0.11 和 oracle-jdk-21.0.12）同时加入 java.installations.paths，
# 使 Gradle 能选到 languageVersion=21 的 JVM 作为 NeoForm 子任务工具；
# 而项目代码本身（java_version=17, compileJava）仍然使用 JDK17 产出 Java 17 class，1.20.1 实机可运行。
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false
org.gradle.java.home=C\:\\Program Files\\Java\\jdk-17
org.gradle.java.installations.auto-detect=false
org.gradle.java.installations.auto-download=false
# 白名单：JDK17（编译/运行）+ JDK21（NeoForm 工具）
org.gradle.java.installations.paths=C\:\\Program Files\\Java\\jdk-17,C\:\\Program Files\\Java\\jdk-21.0.12,C\:\\Users\\MKIII\\.jdks\\ms-21.0.11
