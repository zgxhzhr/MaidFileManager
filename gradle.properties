# ========== 项目基本信息 (保留此块，删除下方重复的 Common 块) ==========
mod_id=maid_file_manager
mod_name=Maid File Manager
mod_author=zgxhzhr
mod_description=车万女仆附属模组，支持跨版本导入导出女仆数据
license=CC0-1.0
credits=Thanks to TartaricAcid for Touhou Little Maid

# ========== 项目与 Java 版本 ==========
version=1.1.2
group=com.example.examplemod
java_version=17

# ========== Minecraft 与映射 ==========
minecraft_version=1.20.1
minecraft_version_range=[1.20.1, 1.22)
# ParchmentMC 1.20.1 最新稳定版，参考 https://parchmentmc.org/docs/getting-started
parchment_minecraft=1.20.1
parchment_version=2023.09.03

# ========== Fabric 配置 ==========
fabric_version=0.92.1+1.20.1
fabric_loader_version=0.16.9

# ========== Forge 配置 ==========
forge_version=47.2.30
forge_loader_version_range=[47,)

# ========== 车万女仆配置 (新增) ==========
# 请访问其 Maven 仓库确认适用于 1.20.1 的最新稳定版本
tlm_version=1.5.3
# 本地 TLM jar 路径（同时作为 Forge 与 Fabric 编译期依赖，仅引用 API）
# 注意：路径中不要含中文，因为 gradle.properties 默认按 ISO-8859-1 读取会乱码
tlm_jar_path=libs/touhoulittlemaid-1.5.3.jar

# ========== Gradle 配置 ==========
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false