# ========== 项目基本信息 ==========
mod_id=maid_file_manager
mod_name=Maid File Manager
mod_author=zgxhzhr
mod_description=车万女仆附属模组，支持跨版本导入导出女仆数据
license=CC0-1.0
credits=Thanks to TartaricAcid for Touhou Little Maid

# ========== 项目与 Java 版本 ==========
version=1.1.1
group=com.example.examplemod
java_version=17

# ========== Minecraft 与映射 ==========
# 【1.20 / 1.20.1 双版本兼容策略】
# 1) 内部构建期使用 1.20.1 坐标（NeoForm/legacyForge 已经完美支持，不会再报 Unknown result: intermediaryToNamedMapping）
# 2) 对外 mods.toml 中：minecraft_version_range = [1.20, 1.22) + forge_loader_version_range = [46,)
#    最终产出的 JAR（maid_file_manager-forge-1.20-1.1.1.jar）可同时安装在 Forge 1.20（46.x）与 Forge 1.20.1（47.x）
minecraft_version=1.20.1
minecraft_version_range=[1.20, 1.22)
parchment_minecraft=1.20.1
parchment_version=2023.09.03

# ========== Fabric 配置 ==========
fabric_version=0.92.1+1.20.1
fabric_loader_version=0.16.9

# ========== Forge 配置 ==========
# 46.x = 1.20；47.x = 1.20.1；放宽到 [46,) 让 JAR 同时兼容
forge_version=47.2.30
forge_loader_version_range=[46,)

# ========== 车万女仆配置 ==========
tlm_version=1.5.3
tlm_jar_path=libs/touhoulittlemaid-1.5.3.jar

# ========== Gradle 配置：JDK 双版本白名单（JDK17 用于编译 class，JDK21 用于 NeoForm Runtime 工具） ==========
# 关键原因：net.neoforged.moddev.legacyforge 2.0.77 插件要求 createMinecraftArtifacts 任务（NeoForm 运行 mappings 处理）使用 JDK21。
# 因此我们把系统上已安装的两个 JDK21（ms-21.0.11 和 oracle-jdk-21.0.12）同时加入 java.installations.paths，
# 让 Gradle 能选到 languageVersion=21 的 JVM 作为 NeoForm 子任务工具；
# 而项目代码本身（java_version=17, compileJava）仍然使用 JDK17 产出 Java 17 class，1.20/1.20.1 实机均可运行。
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false
org.gradle.java.home=C\:\\Program Files\\Java\\jdk-17
org.gradle.java.installations.auto-detect=false
org.gradle.java.installations.auto-download=false
# 白名单：JDK17（编译/运行）+ JDK21（NeoForm 工具）
org.gradle.java.installations.paths=C\:\\Program Files\\Java\\jdk-17,C\:\\Program Files\\Java\\jdk-21.0.12,C\:\\Users\\MKIII\\.jdks\\ms-21.0.11
