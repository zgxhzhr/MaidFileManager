plugins {
    id 'multiloader-loader'
    id 'net.neoforged.moddev.legacyforge'
    id 'me.modmuss50.mod-publish-plugin' version '2.2.0'
}

legacyForge {
    version = "${minecraft_version}-${forge_version}"

    validateAccessTransformers = true

    def at = project(':common').file('src/main/resources/META-INF/accesstransformer.cfg')
    if (at.exists()) {
        accessTransformers = ["src/main/resources/META-INF/accesstransformer.cfg"]
    }
    parchment {
        minecraftVersion = parchment_minecraft
        mappingsVersion = parchment_version
    }
    runs {
        client {
            client()
        }
        data {
            data()
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }
        server {
            server()
        }
    }

    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

sourceSets.main.resources.srcDir 'src/generated/resources'

dependencies {
    compileOnly project(":common")
    // 车万女仆编译期依赖：仅引用其 API，运行时由玩家自行安装
    compileOnly files(rootProject.file(tlm_jar_path))
}

jar {
    finalizedBy('reobfJar')
    // 自检代码（dev 包）只用于构建期验证，不进最终产物
    exclude 'io/github/zgxhzhr/maidfm/dev/**'
}

publishMods {
    file = tasks.named('jar').get().archiveFile
    changelog = file("${rootDir}/CHANGELOG.md").exists() ? file("${rootDir}/CHANGELOG.md").text : 'See release notes on GitHub'
    type = STABLE
    modLoaders.add('forge')

    curseforge {
        projectId = '1681684'
        accessToken = providers.environmentVariable('CURSEFORGE_TOKEN')
        minecraftVersions.add('1.20.1')
        displayName = 'Maid File Manager v' + project.version + ' forge 1.20.1'
    }
}

// ============================================================
// 离线自检：./gradlew :forge:selfTest
// 纯 JDK 实现（无 JUnit 制品可用），跑纯函数断言，不启动 Minecraft。
// 失败时任务失败，可挂到 check/CI 上。
// ============================================================
tasks.register('selfTest', JavaExec) {
    group = 'verification'
    description = '离线自检：纯函数断言（不启动 Minecraft）'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'io.github.zgxhzhr.maidfm.dev.SelfTest'
    // 断言失败时进程 exit 1，JavaExec 会据此让任务失败
    ignoreExitValue = false
    // 控制台默认不是 UTF-8，中文用例名会乱码；JDK 17 用 file.encoding 即可
    jvmArgs = ['-Dfile.encoding=UTF-8']
}
