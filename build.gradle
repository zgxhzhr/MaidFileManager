plugins {
    id 'fabric-loom' version '1.9.2' apply(false)
    id 'net.neoforged.moddev.legacyforge' version '2.0.77' apply(false)
}

// 为所有子项目设置 description，供 processResources 占位符使用
allprojects {
    description = mod_description
    // javadoc 对成品 jar 无意义，且 GBK 控制台下中文注释必炸（doclint 缺 @param 直接报错）——直接关闭
    tasks.withType(Javadoc).configureEach { enabled = false }
}

// Delivery only ships the platform main jar; disable javadoc/javadocJar (doclint fails on undocumented sources)
allprojects {
    tasks.withType(org.gradle.api.tasks.javadoc.Javadoc).configureEach { enabled = false }
    tasks.matching { it.name in ['javadocJar', 'remapJavadocJar'] }.configureEach { enabled = false }
    // sourcesJar 由模板 withSourcesJar() 注册；remapSourcesJar 是 fabric-loom 额外重映射任务，
    // 只禁 sourcesJar 时 loom 仍会把旧 sources jar 重映射进 build/libs，必须一并禁用
    tasks.matching { it.name in ['sourcesJar', 'remapSourcesJar'] }.configureEach { enabled = false }
}